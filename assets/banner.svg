<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#1b263b" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b185ff" />
      <stop offset="100%" stop-color="#7928ca" />
    </linearGradient>

    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0.05" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 54px;
        fill: #ffffff;
        letter-spacing: -1px;
      }
      .gradient-title {
        fill: url(#accent-cyan);
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 20px;
        fill: #94a3b8;
      }
      .tag-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #38bdf8;
      }
      
      /* Subtle CSS pulse animations for background tech elements (behind text) */
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.05); }
      }
      @keyframes floatParticle {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-12px); }
      }
      @keyframes dashMove {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }

      .pulse-circle {
        animation: pulseGlow 6s infinite ease-in-out;
        transform-origin: center;
      }
      .floating-particle-1 {
        animation: floatParticle 4s infinite ease-in-out;
      }
      .floating-particle-2 {
        animation: floatParticle 5.5s infinite ease-in-out reverse;
      }
      .dashed-path {
        stroke-dasharray: 8 6;
        animation: dashMove 12s linear infinite;
      }
    </style>
  </defs>

  <!-- Deep Canvas Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)" />

  <!-- Grid Overlay (Background) -->
  <g opacity="0.12">
    <path d="M 0,60 L 1200,60 M 0,120 L 1200,120 M 0,180 L 1200,180 M 0,240 L 1200,240 M 0,300 L 1200,300" stroke="#38bdf8" stroke-width="1" />
    <path d="M 150,0 L 150,360 M 300,0 L 300,360 M 450,0 L 450,360 M 600,0 L 600,360 M 750,0 L 750,360 M 900,0 L 900,360 M 1050,0 L 1050,360" stroke="#38bdf8" stroke-width="1" />
  </g>

  <!-- Dynamic / Animated Background Flares & Ambient Elements (Behind Foreground Content) -->
  <g class="pulse-circle">
    <circle cx="1060" cy="90" r="140" fill="url(#glow-grad)" filter="url(#glow)" />
    <circle cx="150" cy="270" r="100" fill="url(#glow-grad)" filter="url(#glow)" />
  </g>

  <!-- Animated flow lines behind cards -->
  <path class="dashed-path" d="M 680,180 C 800,130 920,240 1120,180" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.4" />
  <path class="dashed-path" d="M 720,220 C 850,290 980,160 1150,230" fill="none" stroke="#b185ff" stroke-width="2" opacity="0.3" />

  <!-- Visual Mocking Architecture Graphic (Right Half, decorative) -->
  <g transform="translate(730, 65)">
    <!-- Simulated Request Card -->
    <g class="floating-particle-1">
      <rect x="0" y="40" width="180" height="70" rx="10" fill="#13233b" stroke="#0284c7" stroke-width="1.5" opacity="0.9" />
      <circle cx="24" cy="62" r="7" fill="#10b981" />
      <text x="38" y="66" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">GET /api/v1/mock</text>
      <text x="38" y="88" fill="#94a3b8" font-family="monospace" font-size="11">HTTP/1.1 200 OK</text>
    </g>

    <!-- Simulated Stateful Mock Engine Hub -->
    <g transform="translate(195, 80)">
      <rect x="0" y="0" width="180" height="90" rx="12" fill="#1e1b4b" stroke="#7928ca" stroke-width="2" opacity="0.95" />
      <text x="20" y="32" fill="#e9d5ff" font-family="monospace" font-size="13" font-weight="bold">⚡ Mock Server</text>
      <text x="20" y="54" fill="#a855f7" font-family="monospace" font-size="11">● Contract Matching</text>
      <text x="20" y="70" fill="#a855f7" font-family="monospace" font-size="11">● Chaos &amp; Latency</text>
    </g>

    <!-- Simulated Client Response Card -->
    <g class="floating-particle-2" transform="translate(80, 140)">
      <rect x="0" y="0" width="170" height="55" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5" opacity="0.85" />
      <text x="18" y="24" fill="#64748b" font-family="monospace" font-size="11">// Dynamic Payload</text>
      <text x="18" y="42" fill="#38bdf8" font-family="monospace" font-size="11">{ "mocked": true, "ai": 1 }</text>
    </g>
  </g>

  <!-- FOREGROUND: Pill Tag, Title, and Subtitle (Guaranteed in foreground & fully readable) -->
  <g transform="translate(70, 75)">
    <!-- Pill Badge -->
    <g>
      <rect x="0" y="0" width="260" height="32" rx="16" fill="#0369a1" fill-opacity="0.25" stroke="#0284c7" stroke-width="1.2" />
      <circle cx="16" cy="16" r="4" fill="#38bdf8" />
      <text x="28" y="21" class="tag-text">CURATED ECOSYSTEM 2026</text>
    </g>

    <!-- Main Title -->
    <g transform="translate(0, 75)">
      <text class="title-text">
        Awesome <tspan class="gradient-title">API Mocking</tspan> 🎭
      </text>
    </g>

    <!-- Subtitle / Tagline -->
    <g transform="translate(0, 120)">
      <text class="subtitle-text">
        Top SaaS &amp; Open-Source Mock Servers, Contract Testing &amp; Simulation
      </text>
    </g>

    <!-- Feature Pillars -->
    <g transform="translate(0, 160)">
      <g>
        <rect x="0" y="0" width="135" height="30" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="19" fill="#cbd5e1" font-family="sans-serif" font-size="12">⚡ Dynamic Stubs</text>
      </g>
      <g transform="translate(145, 0)">
        <rect x="0" y="0" width="145" height="30" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="19" fill="#cbd5e1" font-family="sans-serif" font-size="12">🛡️ Contract Testing</text>
      </g>
      <g transform="translate(300, 0)">
        <rect x="0" y="0" width="130" height="30" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="19" fill="#cbd5e1" font-family="sans-serif" font-size="12">🎲 Chaos Injection</text>
      </g>
      <g transform="translate(440, 0)">
        <rect x="0" y="0" width="130" height="30" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="19" fill="#cbd5e1" font-family="sans-serif" font-size="12">🤖 AI &amp; MCP Mocks</text>
      </g>
    </g>
  </g>
</svg>
